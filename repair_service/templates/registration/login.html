{% extends "base.html" %}
{% block title %}Вход — РемТех{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Вход</h1>
  <form method="post" class="form-card">
    {% csrf_token %}
    {% include "_form.html" %}

    <a class="btn btn-outline" href="{% url 'register' %}">Регистрация</a></div>
  </form>
</div>
{% endblock %}
